[project]
name = "agent-on-tracks"
version = "0.10.0"
description = "Agent on Tracks — event-sourced runtime for spec-driven agent development (v0.5)"
requires-python = ">=3.10"
# v0.9 (ARCH-009): web 后台持续驱动与最小工作台的首个运行时依赖。
# starlette: >=1.3.1 clears PYSEC-2026-161/248/249/2280/2281 (security gate
# 2026-10-04); the tracked surface (routes/middleware/StaticFiles) is
# compatible through 1.7.0.
# v0.10 (ARCH-010 §3.2): certifi 进入运行时依赖——live GitHub 请求层显式使用
# certifi CA bundle 发起 TLS 校验（FR-0330，修复标准 macOS Python 下 live 通道
# TLS 失败 #181）。
# v0.10 (FR-0328): 版本号在设计期 bump 到发布版本——宿主合同 version gate 的
# file/key/expect 绑定在 M-VERIFY 要求 pyproject version == tracks.__version__
# == 发布 tag 去 v 前缀，发布期升版惯例由该门禁取代。
dependencies = [
    "starlette>=1.3.1",
    "uvicorn==0.49.0",
    "certifi==2026.7.22",
]

[project.scripts]
trac = "tracks.cli.main:main"

# Quality gate + test tooling. Pinned: the pre-commit gate's behavior depends on
# tool versions (rule codes/defaults), so pin for reproducible gates.
# Install: `.venv/bin/pip install -e '.[dev]'`
[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "pytest-cov==7.1.0",
    "coverage==7.15.2",
    "ruff==0.16.0",
    "pylint==4.0.6",
    "flake8==7.3.0",
    "flake8-cognitive-complexity==0.1.0",
    # v0.10 (NFR-0155): UI e2e 层（Playwright/Chromium）——独立基础设施预算；
    # 浏览器二进制经 `.venv/bin/playwright install chromium` 下载（CI ui-e2e
    # required check），默认套件经 `ui` marker 排除（addopts）。
    "playwright==1.63.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tracks*"]

[tool.setuptools.package-data]
tracks = [
    "agents/*.md",
    "skills/*/*.md",
    "templates/*.md",
    "templates/pre-commit/*.md",
    "templates/pre-commit/*.yaml",
    "templates/pre-commit/*.yml",
    "assets/*.js",
    "assets/demo_host/architecture.md",
    "assets/demo_host/demo_calc.py",
    "assets/demo_host/flake8.ini",
    "assets/demo_host/pyproject.toml",
    "assets/demo_host/tracks-project.toml",
    "assets/demo_host/tests/unit/*",
    "assets/demo_host/tests/integration/*",
    "assets/demo_host/tests/e2e/*",
    "assets/reference_host/architecture.md",
    "assets/reference_host/ci.yml",
    "assets/reference_host/flake8.ini",
    "assets/reference_host/host_calc.py",
    "assets/reference_host/pyproject.toml",
    "assets/reference_host/tracks-project.toml",
    "assets/reference_host/tests/unit/*",
    "assets/reference_host/tests/integration/*",
    "assets/reference_host/tests/e2e/*",
    "server/static/*.html",
    "server/static/*.js",
    "server/static/*.css",
    "server/static/vendor/vditor/*",
    "server/static/vendor/vditor/js/lute/*",
    "server/static/vendor/vditor/js/highlight.js/*",
    "server/static/vendor/vditor/js/highlight.js/styles/*",
    "server/static/vendor/vditor/js/i18n/*",
    "server/static/vendor/vditor/js/icons/*",
    "server/static/vendor/vditor/images/*",
    "server/static/app/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Parallelism is opt-in; unit plus deterministic integration/e2e suites may
# run with xdist, so -n is intentionally absent from addopts. `tests/e2e_live`
# is the real Agent/external-channel suite and remains serial because it relies
# on live Agent/session/shared external state. Run them in parallel with:
#   .venv/bin/python -m pytest tests/unit -n 4 --dist loadscope -q
#   .venv/bin/python -m pytest tests/integration tests/e2e -n 4 --dist loadscope -q
# performance benchmarks (NFR-0020) are opt-in: excluded from the default suite,
# run on demand with `pytest -m performance`.
# v0.10 (NFR-0155): `ui` marker 的 Playwright/Chromium 浏览器层默认排除（浏览器
# 二进制是独立基础设施预算，由 CI ui-e2e required check 预装）；本地运行 UI 层：
# `.venv/bin/playwright install chromium` 后 `pytest -m ui`。
addopts = "-q -m 'not performance and not ui'"
markers = [
    "performance: opt-in NFR-0020 perf benchmark; excluded from default runs (run: pytest -m performance)",
    "integration: deterministic integration layer under tests/integration",
    "e2e: end-to-end happy-path layer under tests/e2e",
    "ui: browser-driven UI e2e (Playwright/Chromium); excluded from default runs, CI ui-e2e required check runs it (NFR-0155)",
]

[tool.coverage.run]
# E2E drives the CLI in subprocesses; parallel mode lets each process (the test
# runner and every `trac` subprocess) write its own data file, merged later by
# `coverage combine`. source_pkgs (not paths) so measurement works regardless of
# the subprocess cwd (a tmp host repo).
parallel = true
source_pkgs = ["tracks"]
# 2026-09-24 (island-2 coverage gate): pure-I/O backends (opencode subprocess
# spawn, pty lifecycle, session registry, server socket paths) are unreachable
# from unit tests by construction -- they need a real opencode binary and a
# listening port. Omitting them keeps the 95% threshold meaningful for the
# testable surface (kernel logic, supervisors, projections, gates) instead of
# diluting it with I/O plumbing. Future: mockable backends for the opencode v2
# migration (user note 2026-09-24) would let these lines re-enter coverage.
omit = [
    "tracks/effects/opencode_run.py",
    "tracks/effects/opencode_session.py",
    "tracks/effects/opencode_act.py",
    "tracks/effects/opencode_core.py",
    "tracks/effects/opencode.py",
    "tracks/effects/fake_act.py",
    "tracks/effects/fake.py",
    "tracks/effects/devon_patch.py",
    "tracks/effects/devon_evidence.py",
    "tracks/effects/adjudicate.py",
]

[tool.coverage.report]
show_missing = true
# Mirror the run-level omit: already-collected data from omitted files is
# excluded from the report TOTAL too (the quality gate reads the report).
omit = [
    "tracks/effects/opencode_run.py",
    "tracks/effects/opencode_session.py",
    "tracks/effects/opencode_act.py",
    "tracks/effects/opencode_core.py",
    "tracks/effects/opencode.py",
    "tracks/effects/fake_act.py",
    "tracks/effects/fake.py",
    "tracks/effects/devon_patch.py",
    "tracks/effects/devon_evidence.py",
    "tracks/effects/adjudicate.py",
]

# --- quality gate (run by .githooks/pre-commit) -----------------------------
# Ruff = general lint + line length. Cognitive complexity (flake8 CCR001) is the
# single metric for branching/nesting depth. pylint = duplication + length only.
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = ["SIM108"]  # allow explicit if/else where clearer than a ternary

[tool.pylint.messages_control]
disable = "all"
enable = "R0801,C0302,R0915,R0914"  # duplicate-code, too-many-lines, too-many-statements, too-many-locals

[tool.pylint.format]
max-module-lines = 1200  # NFR-06b: product code max 1024; tests allowed higher ceiling

[tool.pylint.similarities]
min-similarity-lines = 5  # NFR-06a: no >5-line duplicate blocks
ignore-comments = true
ignore-docstrings = true
ignore-signatures = true

[tool.pylint.design]
max-statements = 50
max-locals = 15
