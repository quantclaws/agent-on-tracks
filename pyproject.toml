[project]
name = "agent-on-tracks"
version = "0.1.0"
description = "Agent on Tracks — event-sourced runtime for spec-driven agent development (v0.1)"
requires-python = ">=3.10"
# pytest is a runtime dependency, not only a dev tool: the M-TEST executor
# (FR-0030/0050) shells out to `[sys.executable, "-m", "pytest"]` for collection
# and RED_CHECK during a normal `trac run` (architecture.md §3.2). An installed
# wheel must therefore make pytest importable without a separate dev install.
dependencies = [
    "pytest==9.1.1",
]

[project.scripts]
trac = "tracks.cli.main:main"

# Quality gate + test tooling. Pinned: the pre-commit gate's behavior depends on
# tool versions (rule codes/defaults), so pin for reproducible gates.
# Install: `.venv/bin/pip install -e '.[dev]'`
[project.optional-dependencies]
dev = [
    "coverage==7.15.2",
    "ruff==0.16.0",
    "pylint==4.0.6",
    "flake8==7.3.0",
    "flake8-cognitive-complexity==0.1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tracks*"]

[tool.setuptools.package-data]
tracks = [
    "agents/*.md",
    "skills/*/*.md",
    "templates/*.md",
    "templates/pre-commit/*.md",
    "templates/pre-commit/*.yaml",
    "templates/pre-commit/*.yml",
    "assets/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# performance benchmarks (NFR-0020) are opt-in: excluded from the default suite,
# run on demand with `pytest -m performance`.
addopts = "-q -m 'not performance'"
markers = [
    "performance: opt-in NFR-0020 perf benchmark; excluded from default runs (run: pytest -m performance)",
]

[tool.coverage.run]
# E2E drives the CLI in subprocesses; parallel mode lets each process (the test
# runner and every `trac` subprocess) write its own data file, merged later by
# `coverage combine`. source_pkgs (not paths) so measurement works regardless of
# the subprocess cwd (a tmp host repo).
parallel = true
source_pkgs = ["tracks"]

[tool.coverage.report]
show_missing = true

# --- quality gate (run by .githooks/pre-commit) -----------------------------
# Ruff = general lint + line length. Cognitive complexity (flake8 CCR001) is the
# single metric for branching/nesting depth. pylint = duplication + length only.
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = ["SIM108"]  # allow explicit if/else where clearer than a ternary

[tool.pylint.messages_control]
disable = "all"
enable = "R0801,C0302,R0915,R0914"  # duplicate-code, too-many-lines, too-many-statements, too-many-locals

[tool.pylint.format]
max-module-lines = 1050  # NFR-06b (bumped from 1000: machine.py reached the limit)

[tool.pylint.similarities]
min-similarity-lines = 5  # NFR-06a: no >5-line duplicate blocks
ignore-comments = true
ignore-docstrings = true
ignore-signatures = true

[tool.pylint.design]
max-statements = 50
max-locals = 15
