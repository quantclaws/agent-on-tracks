[project]
name = "agent-on-tracks"
version = "0.1.0"
description = "Agent on Tracks — event-sourced runtime for spec-driven agent development (v0.1)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
trac = "tracks.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tracks*"]

[tool.setuptools.package-data]
tracks = [
    "templates/*.md",
    "templates/pre-commit/*.md",
    "templates/pre-commit/*.yaml",
    "templates/pre-commit/*.yml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
