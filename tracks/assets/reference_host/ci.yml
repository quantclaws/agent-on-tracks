name: ci
on:
  push:
    branches: ["**"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m venv .venv
      - run: .venv/bin/pip install -e '.[dev]'
      - name: ruff
        run: .venv/bin/ruff check host_calc.py tests
      - name: cognitive complexity
        run: .venv/bin/flake8 --config flake8.ini host_calc.py
      - name: pylint
        run: .venv/bin/pylint --disable=all --enable=R0801,C0302,R0915,R0914 host_calc.py tests

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m venv .venv
      - run: .venv/bin/pip install -e '.[dev]'
      - name: coverage
        run: |
          .venv/bin/coverage run -m pytest tests -q
          .venv/bin/coverage report --fail-under=95

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m venv .venv
      - run: .venv/bin/pip install -e '.[dev]'
      - name: pytest
        run: .venv/bin/python -m pytest tests -q
