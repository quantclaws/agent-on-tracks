# Host project test execution contract (FR-0190).
# Produced by Archer in M-DESIGN. Consumed by project.py load_contract() and
# the executor (collect / run commands for M-TEST and M-IMPL GREEN_GATE /
# ISLAND_GATE_2). Test concurrency and JUnit flags are contract-owned.

[unit]
framework = "pytest"
paths = ["tests/unit/"]
collect = ".venv/bin/python -m pytest --collect-only tests/unit/"
run = ".venv/bin/python -m pytest tests/unit/ --tb=short -q -n 8 --dist loadscope --junitxml={result}"
run_selected = ".venv/bin/python -m pytest {nodes} --tb=short -q -n 8 --dist loadscope --junitxml={result}"
cwd = "."

[integration]
framework = "pytest"
paths = ["tests/integration/"]
collect = ".venv/bin/python -m pytest --collect-only tests/integration/"
run = ".venv/bin/python -m pytest tests/integration/ --tb=short -q -n 8 --dist loadscope --junitxml={result}"
run_selected = ".venv/bin/python -m pytest {nodes} --tb=short -q -n 8 --dist loadscope --junitxml={result}"
cwd = "."

[e2e]
framework = "pytest"
paths = ["tests/e2e/"]
collect = ".venv/bin/python -m pytest --collect-only tests/e2e/"
run = ".venv/bin/python -m pytest tests/e2e/ --tb=short -q -n 8 --dist loadscope --junitxml={result}"
run_selected = ".venv/bin/python -m pytest {nodes} --tb=short -q -n 8 --dist loadscope --junitxml={result}"
cwd = "."

[nightly]
schedule = "0 3 * * *"
workflow = ".github/workflows/nightly.yml"
job = "nightly-regression"
layers = ["unit", "integration", "e2e"]
purpose = "current FULL suite (R1+R2) regression; result fetch future; not a local gate"

[adapter]
id = "reference-pytest"
protocol = "tracks-test-result"
version = 1

# Directory layout designed by Archer in M-DESIGN (FR-0120).
# Consumed by the runtime auditor to authorize agent writes per role.
[layout]

[layout.devon]
writable = ["tracks/", "tests/unit/"]

[layout.shield]
writable = ["tests/integration/", "tests/e2e/", "tests/e2e_live/", "tests/assets/", "tests/counterexamples/", "tests/_support/"]

# Lint validation contract (B4, issue #5): command the runtime runs over
# Devon's changed deliverables at RED_GATE / GREEN_GATE. Tooling is
# Archer's choice — the runtime is language-neutral and never hardcodes
# a linter. Non-zero exit => verdict.failed check=lint (no attempt
# consumed; mechanical findings never burn the semantic budget).
[lint]
check = ".venv/bin/ruff check"

# ---------------------------------------------------------------------------
# Host contract v1 (FR-0281 / IF-HOSTCONTRACT-001, v0.8).
# Release-pipeline machine truth merged into this file per the spec's
# "project.toml / host-contract.toml" alternative (single contract file per
# host). Consumed by executor/host_contract.py and the M-VERIFY /
# M-SECURITY / M-RELEASE / M-PUBLISH handlers. The Runtime executes only
# these declared commands and consumes versioned normalized results
# (tracks-gate-result v1); it never hardcodes host language semantics.
# Placeholders (two-level, interfaces §1e): base set {version} {major}
# {minor} {n} {ulid} {artifact} {prefix} {prefix_bin} {result} resolve from
# run version facts / build outputs; operation-step TARGET positions also
# accept {feature_tag} / {patch_line} / {prerelease_tag}, expanded via the
# [host-contract.version_scheme] templates. Anything else fails closed.
# ---------------------------------------------------------------------------

[host-contract]
version = 1
language = "python"
toolchain = "cpython>=3.10"
install = ".venv/bin/python -m pip install -e '.[dev]'"

# ---- M-VERIFY local gates (FR-0269) ---------------------------------------

[[host-contract.local_gate]]
kind = "quality"
source = "guard_registry"
categories = [
  "lint_format", "static_analysis", "cognitive_complexity", "file_length",
  "method_length_locals", "duplication", "coverage_threshold",
]
result_channel = "exit_code"
timeout_seconds = 3600

[[host-contract.local_gate]]
kind = "trace"
command = ".venv/bin/trac check trace --version {version}"
result_channel = "exit_code"
timeout_seconds = 600

[[host-contract.local_gate]]
kind = "reach"
command = ".venv/bin/trac check reach"
result_channel = "exit_code"
timeout_seconds = 600

[[host-contract.local_gate]]
kind = "anti_slop"
command = ".venv/bin/trac validate --file .tracks/projects/{version}/architecture.md"
result_channel = "exit_code"
timeout_seconds = 600

[[host-contract.local_gate]]
kind = "version"
source = "version_decl"
result_channel = "exit_code"
timeout_seconds = 60

# ---- version scheme (FR-0277 patch semantics) ------------------------------
# The version gate is tag-derivation based: computed release tags must be
# absent on the remote and derivation inputs ({n} from remote tag census) are
# recorded. file/key/expect binding is intentionally NOT declared for this
# host: pyproject.toml is a guard-registry config input and a version bump
# would churn its frozen config_digest (architecture §3.7).

[host-contract.version_scheme]
feature_tag = "v{minor}.0"
patch_line = "v{minor}.{n}"
prerelease_tag = "v{minor}.{n}-pre.{ulid}"

# ---- build / artifact + post-install public outlet smoke (FR-0269) ---------

[host-contract.build]
command = ".venv/bin/python -m pip wheel --no-deps -w dist ."
artifact = "dist/*.whl"
result_channel = "exit_code"
timeout_seconds = 900

[host-contract.smoke]
steps = [
  ".venv/bin/python -m pip install --no-deps --force-reinstall --prefix {prefix} {artifact}",
  "{prefix_bin}/trac --help",
]
result_channel = "exit_code"
timeout_seconds = 600

# ---- M-SECURITY policy (FR-0272) -------------------------------------------

[[host-contract.security_scan]]
id = "dependency-audit"
tool = "pip-audit"
tool_version = "2.7.3"
install = ".venv/bin/python -m pip install pip-audit==2.7.3"
command = ".venv/bin/pip-audit --strict"
result_channel = "exit_code"
threshold = "vulnerabilities=0"
timeout_seconds = 900

[[host-contract.security_scan]]
id = "static-security-lint"
tool = "bandit"
tool_version = "1.8.3"
install = ".venv/bin/python -m pip install bandit==1.8.3"
command = ".venv/bin/bandit -r tracks -ll -q"
result_channel = "exit_code"
threshold = "severity_high_or_above=0"
timeout_seconds = 600

# ---- required-CI binding (FR-0270) -----------------------------------------

[host-contract.ci]
repo_env = "TRAC_GITHUB_REPO"
workflow = "ci.yml"
required_checks = ["lint", "coverage", "test", "deliverables", "trace", "reach"]
conclusion = "success"

# ---- issue tracker lifecycle (FR-0283/FR-0284) ------------------------------

[host-contract.tracker]
repo_env = "TRAC_GITHUB_REPO"
project_env = "TRAC_GITHUB_PROJECT"
milestone_template = "release {version}"

# ---- M-PUBLISH operation plans (FR-0275) ------------------------------------
# step grammar: KIND:TARGET[:when=COND]; when=active_release_branch makes the
# step conditional on the existence of the journey's active release branch.

[host-contract.operations.feature]
steps = [
  "merge:main",
  "tag:{feature_tag}",
  "artifact:{artifact}",
  "release:{feature_tag}",
]

[host-contract.operations.post_release]
steps = [
  "merge:main",
  "merge:release/{minor}:when=active_release_branch",
  "tag:{patch_line}",
  "artifact:{artifact}",
  "release:{patch_line}",
]

[host-contract.operations.dev]
requires = ["active_release_branch"]
steps = [
  "merge:release/{minor}",
  "tag:{prerelease_tag}",
]
