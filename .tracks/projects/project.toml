# Host project test execution contract (FR-0190).
# Produced by Archer in M-DESIGN. Consumed by project.py load_contract() and
# the executor (collect / run commands for M-TEST and M-IMPL GREEN_GATE /
# ISLAND_GATE_2). Test concurrency and JUnit flags are contract-owned.

[unit]
framework = "pytest"
paths = ["tests/unit/"]
collect = ".venv/bin/python -m pytest --collect-only tests/unit/"
run = ".venv/bin/python -m pytest tests/unit/ --tb=short -q -n 8 --dist loadscope --junitxml={result}"
run_selected = ".venv/bin/python -m pytest {nodes} --tb=short -q -n 8 --dist loadscope --junitxml={result}"
cwd = "."

[integration]
framework = "pytest"
paths = ["tests/integration/"]
collect = ".venv/bin/python -m pytest --collect-only tests/integration/"
run = ".venv/bin/python -m pytest tests/integration/ --tb=short -q -n 8 --dist loadscope --junitxml={result}"
run_selected = ".venv/bin/python -m pytest {nodes} --tb=short -q -n 8 --dist loadscope --junitxml={result}"
cwd = "."

[e2e]
framework = "pytest"
paths = ["tests/e2e/"]
collect = ".venv/bin/python -m pytest --collect-only tests/e2e/"
run = ".venv/bin/python -m pytest tests/e2e/ --tb=short -q -n 8 --dist loadscope --junitxml={result}"
run_selected = ".venv/bin/python -m pytest {nodes} --tb=short -q -n 8 --dist loadscope --junitxml={result}"
cwd = "."

[nightly]
schedule = "0 3 * * *"
workflow = ".github/workflows/nightly.yml"
job = "nightly-regression"
layers = ["unit", "integration", "e2e"]
purpose = "current FULL suite (R1+R2) regression; result fetch future; not a local gate"

[adapter]
id = "reference-pytest"
protocol = "tracks-test-result"
version = 1

# Directory layout designed by Archer in M-DESIGN (FR-0120).
# Consumed by the runtime auditor to authorize agent writes per role.
[layout]

[layout.devon]
writable = ["tracks/", "tests/unit/"]

[layout.shield]
writable = ["tests/integration/", "tests/e2e/", "tests/e2e_live/", "tests/assets/", "tests/counterexamples/", "tests/_support/"]

# Lint validation contract (B4, issue #5): command the runtime runs over
# Devon's changed deliverables at RED_GATE / GREEN_GATE. Tooling is
# Archer's choice — the runtime is language-neutral and never hardcodes
# a linter. Non-zero exit => verdict.failed check=lint (no attempt
# consumed; mechanical findings never burn the semantic budget).
[lint]
check = ".venv/bin/ruff check"
