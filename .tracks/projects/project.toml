# Host project test execution contract (FR-0190).
# Produced by Archer in M-DESIGN. Consumed by project.py load_contract() and
# the executor (collect / run commands for M-TEST and M-IMPL GREEN_GATE /
# ISLAND_GATE_2).

[integration]
framework = "pytest"
paths = ["tests/integration/"]
collect = ".venv/bin/python -m pytest --collect-only -q tests/integration/"
run = ".venv/bin/python -m pytest tests/integration/ --tb=short -q"
cwd = "."

[e2e]
framework = "pytest"
paths = ["tests/e2e/"]
collect = ".venv/bin/python -m pytest --collect-only -q tests/e2e/"
run = ".venv/bin/python -m pytest tests/e2e/ --tb=short -q"
cwd = "."

# Directory layout designed by Archer in M-DESIGN (FR-0120).
# Consumed by the runtime auditor to authorize agent writes per role.
[layout]

[layout.devon]
writable = ["tracks/", "tests/unit/"]

[layout.shield]
writable = ["tests/integration/", "tests/e2e/", "tests/e2e_live/", "tests/assets/", "tests/counterexamples/"]
