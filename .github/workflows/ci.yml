# CI workflow — stable required checks for v0.5 M-IMPL.
#
# The stable required check names are defined in architecture.md §4.2/§4.3.
# routine required DAG: lint + coverage + test + deliverables + trace + reach
# milestone (tag/release): release-evidence (after all routine jobs)
# live channel (weekly/manual): live-opencode (opt-in, non-required)
#
# Stable required checks (merge only recognizes CI conclusion):
#   1. lint        — ruff + flake8 + pylint (pre-commit equivalent)
#   2. coverage    — coverage report --fail-under=89
#   3. test        — pytest (unit + integration + e2e fake channel)
#   4. deliverables — trac check deliverables
#   5. trace       — trac check trace --json
#   6. reach       — trac check reach --json
#   7. release-evidence — tag/release milestone hard gate (live journey + check)
#
# Live channel (tests/e2e_live/): skip on missing credentials (independent
# opt-in job), NOT a required check.

name: ci

on:
  push:
    branches: [main, 'releases/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  # FR-0233 opt-in live channel (architecture.md §4.3): an operator may
  # explicitly trigger the real e2e_live journey via workflow_dispatch.
  workflow_dispatch:
  # Weekly anti-rot run of the real live channel (architecture.md §4.3).
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install dev deps
        run: pip install -e '.[dev]'
      - name: ruff
        run: ruff check tracks tests
      - name: cognitive complexity
        run: flake8 tracks
      - name: pylint (dup + length + method + locals)
        run: |
          pylint --disable=all --enable=R0801,C0302 tracks
          pylint --disable=all --enable=R0915,R0914 tracks

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install dev deps (venv -- the contract commands resolve .venv/bin/python)
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[dev]'
      - name: materialize the deployed agent/skill copies (.opencode)
        run: |
          mkdir -p .opencode/agents .opencode/skills
          cp -R tracks/agents/. .opencode/agents/
          cp -R tracks/skills/. .opencode/skills/
      - name: coverage
        run: |
          .venv/bin/python -m coverage run -m pytest tests/unit tests/integration tests/e2e -q -m 'not performance' -p no:cacheprovider
          .venv/bin/python -m coverage combine || true
          .venv/bin/python -m coverage report --fail-under=89

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install dev deps (venv -- the contract commands resolve .venv/bin/python)
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[dev]'
      - name: materialize the deployed agent/skill copies (.opencode)
        # the deployment face is gitignored; the source/effective parity
        # meta-tests need it materialized from the tracked sources
        run: |
          mkdir -p .opencode/agents .opencode/skills
          cp -R tracks/agents/. .opencode/agents/
          cp -R tracks/skills/. .opencode/skills/
      - name: pytest
        run: .venv/bin/python -m pytest tests/unit tests/integration tests/e2e -q -m 'not performance' -p no:cacheprovider

  deliverables:
    name: deliverables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install dev deps
        run: pip install -e '.[dev]'
      - name: trac check deliverables
        run: trac check deliverables

  # Foundation task: activated after Devon implements `trac check trace`.
  trace:
    name: trace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install dev deps
        run: pip install -e '.[dev]'
      - name: trac check trace (asset-level closure)
        # v0.6 classic semantics: git-only assets (test markers vs docs) are
        # verifiable on a fresh checkout. The candidate-bound closure layer
        # (v0.7+) requires the runtime event store and is enforced by the
        # M-VERIFY local gates on the release candidate instead.
        run: trac check trace --version v0.6

  # Foundation task: activated after Devon implements `trac check reach`.
  reach:
    name: reach
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install dev deps
        run: pip install -e '.[dev]'
      - name: trac check reach
        run: trac check reach --json

  # Live channel: weekly/manual opt-in real OpencodeBackend journey.
  # Non-required; skip on missing credentials with LIVE_SKIPPED.
  # Architecture.md §4.3: weekly schedule keeps the real channel from rotting.
  live-opencode:
    name: live-opencode
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install dev deps
        run: pip install -e '.[dev]'
      - name: run live journey (skip on missing credentials)
        env:
          TRAC_LIVE_PROVIDER: ${{ secrets.TRAC_LIVE_PROVIDER }}
          TRAC_LIVE_MODEL: ${{ secrets.TRAC_LIVE_MODEL }}
          TRAC_LIVE_BASE_URL: ${{ secrets.TRAC_LIVE_BASE_URL }}
          TRAC_LIVE_API_KEY: ${{ secrets.TRAC_LIVE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          TRAC_GITHUB_REPO: ${{ vars.TRAC_GITHUB_REPO }}
          TRAC_LIVE_ISSUE: ${{ vars.TRAC_LIVE_ISSUE }}
        run: pytest -q -rs tests/e2e_live/test_m_impl_release_evidence.py tests/e2e_live/test_hotfix_live.py

  # Milestone hard gate: tag/release candidate only. Runs the real e2e_live
  # journey (never skip) and verifies current candidate's live evidence.
  # Architecture.md §4.3: fail closed on missing credentials, skip, fake or stale.
  release-evidence:
    name: release-evidence
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, coverage, test, deliverables, trace, reach]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install dev deps
        run: pip install -e '.[dev]'
      - name: probe credentials (fail closed, never skip)
        env:
          TRAC_LIVE_API_KEY: ${{ secrets.TRAC_LIVE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "${TRAC_LIVE_API_KEY:-}" ]; then
            echo "LIVE_SKIPPED: missing TRAC_LIVE_API_KEY"
            exit 1
          fi
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "LIVE_SKIPPED: missing GITHUB_TOKEN"
            exit 1
          fi
      - name: run live journey (milestone hard gate)
        env:
          TRAC_LIVE_PROVIDER: ${{ secrets.TRAC_LIVE_PROVIDER }}
          TRAC_LIVE_MODEL: ${{ secrets.TRAC_LIVE_MODEL }}
          TRAC_LIVE_BASE_URL: ${{ secrets.TRAC_LIVE_BASE_URL }}
          TRAC_LIVE_API_KEY: ${{ secrets.TRAC_LIVE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          TRAC_GITHUB_REPO: ${{ vars.TRAC_GITHUB_REPO }}
          TRAC_LIVE_ISSUE: ${{ vars.TRAC_LIVE_ISSUE }}
        run: pytest -q -rs tests/e2e_live/test_m_impl_release_evidence.py tests/e2e_live/test_hotfix_live.py
      - name: trac check release-evidence
        run: trac check release-evidence --json
